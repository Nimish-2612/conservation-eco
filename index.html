<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conservation Economics Quiz</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="quiz-container">
      <div class="header">
        <h1>Conservation Economics Quiz</h1>
        <div class="score">Score: <span id="score">0</span>/120</div>
      </div>

      <div class="progress-bar">
        <div class="progress" id="progress"></div>
      </div>

      <div id="quiz">
        <div class="question-number">
          Question <span id="current-question">1</span> of 120
        </div>
        <div class="question" id="question"></div>
        <div class="options" id="options"></div>

        <div class="navigation">
          <button id="prev-btn" disabled>Previous</button>
          <button id="next-btn">Next</button>
        </div>
      </div>

      <div class="result-container" id="result">
        <h2>Quiz Completed!</h2>
        <p>Your final score is: <span id="final-score">0</span>/120</p>
        <button class="restart-btn" id="restart-btn">Restart Quiz</button>
      </div>
    </div>

    <!-- First load the questions.js file -->
    <script src="questions.js"></script>
    
    <!-- Then load the main script that uses the questions data -->
    <script>
      // Create a randomized copy of the questions
      let randomizedQuizData = [...quizData]; // First make a copy
      
      // Fisher-Yates shuffle algorithm to randomize questions
      function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
      }
      
      // Shuffle the questions
      randomizedQuizData = shuffleArray(randomizedQuizData);
      
      let currentQuestion = 0;
      let score = 0;
      let answered = Array(randomizedQuizData.length).fill(false);

      const questionEl = document.getElementById("question");
      const optionsEl = document.getElementById("options");
      const prevBtn = document.getElementById("prev-btn");
      const nextBtn = document.getElementById("next-btn");
      const currentQuestionEl = document.getElementById("current-question");
      const scoreEl = document.getElementById("score");
      const progressEl = document.getElementById("progress");
      const quizEl = document.getElementById("quiz");
      const resultEl = document.getElementById("result");
      const finalScoreEl = document.getElementById("final-score");
      const restartBtn = document.getElementById("restart-btn");

      function loadQuestion() {
        const question = randomizedQuizData[currentQuestion];
        questionEl.textContent = question.question;

        optionsEl.innerHTML = "";

        // Create a copy of options to randomize answer positions
        const randomizedOptions = [...question.options];
        shuffleArray(randomizedOptions);

        randomizedOptions.forEach((option) => {
          const optionElement = document.createElement("div");
          optionElement.classList.add("option");
          optionElement.textContent = option;

          if (answered[currentQuestion]) {
            if (option === question.correctAnswer) {
              optionElement.classList.add("correct");
            } else if (
              optionElement.textContent ===
              document.querySelector(".option.incorrect")?.textContent
            ) {
              optionElement.classList.add("incorrect");
            }
          } else {
            optionElement.addEventListener("click", () =>
              selectOption(optionElement, option)
            );
          }

          optionsEl.appendChild(optionElement);
        });

        currentQuestionEl.textContent = currentQuestion + 1;
        progressEl.style.width = `${
          ((currentQuestion + 1) / randomizedQuizData.length) * 100
        }%`;

        prevBtn.disabled = currentQuestion === 0;
        nextBtn.textContent =
          currentQuestion === randomizedQuizData.length - 1 ? "Finish" : "Next";
      }

      function selectOption(selectedOption, selectedAnswer) {
        if (answered[currentQuestion]) return;

        const question = randomizedQuizData[currentQuestion];

        if (selectedAnswer === question.correctAnswer) {
          selectedOption.classList.add("correct");
          score++;
          scoreEl.textContent = score;
        } else {
          selectedOption.classList.add("incorrect");

          // Highlight the correct answer
          const options = optionsEl.querySelectorAll(".option");
          options.forEach((option) => {
            if (option.textContent === question.correctAnswer) {
              option.classList.add("correct");
            }
          });
        }

        answered[currentQuestion] = true;

        // Auto advance to next question after a short delay
        if (currentQuestion < randomizedQuizData.length - 1) {
          setTimeout(() => {
            nextQuestion();
          }, 1000);
        }
      }

      function nextQuestion() {
        if (currentQuestion < randomizedQuizData.length - 1) {
          currentQuestion++;
          loadQuestion();
        } else {
          showResult();
        }
      }

      function prevQuestion() {
        if (currentQuestion > 0) {
          currentQuestion--;
          loadQuestion();
        }
      }

      function showResult() {
        quizEl.style.display = "none";
        resultEl.style.display = "block";
        finalScoreEl.textContent = score;
      }

      function restartQuiz() {
        // Re-shuffle questions for a new quiz experience
        randomizedQuizData = shuffleArray([...quizData]);
        
        currentQuestion = 0;
        score = 0;
        answered = Array(randomizedQuizData.length).fill(false);
        scoreEl.textContent = score;

        quizEl.style.display = "block";
        resultEl.style.display = "none";

        loadQuestion();
      }

      // Event listeners
      nextBtn.addEventListener("click", nextQuestion);
      prevBtn.addEventListener("click", prevQuestion);
      restartBtn.addEventListener("click", restartQuiz);

      // Initialize the quiz
      loadQuestion();
    </script>
  </body>
</html>
